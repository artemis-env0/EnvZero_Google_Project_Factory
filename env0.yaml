version: 2
shell: bash

deploy:
  steps:
    setupVariables:
      after:
        - name: Who is authenticated?
          run: |
            set -euo pipefail
            echo "=== Authenticated principal ==="
            if [ -n "${GOOGLE_CREDENTIALS-}" ]; then
              echo "$GOOGLE_CREDENTIALS" | jq -r '.client_email'
            elif [ -n "${GOOGLE_APPLICATION_CREDENTIALS-}" ] && [ -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
              jq -r '.client_email' "$GOOGLE_APPLICATION_CREDENTIALS"
            else
              gcloud auth list --filter=status:ACTIVE --format='value(account)' || true
            fi

        - name: Remove any stale/bad tfvars
          run: |
            rm -f env0.auto.tfvars.json
            echo "Removed stale env0.auto.tfvars.json (if existed)."

        - name: Resolve inputs (supports Terraform Variables or TF_VAR_*)
          run: |
            set -euo pipefail

            # Helper: prefer TF_VAR_<name> if present, else bare <name>
            resolve() {
              local key="$1"
              local tfvar="TF_VAR_${key}"
              if [ -n "${!tfvar-}" ]; then
                echo "${!tfvar}"
              elif [ -n "${!key-}" ]; then
                echo "${!key}"
              else
                echo ""
              fi
            }

            export RES_BOOTSTRAP_PROJECT_ID="$(resolve bootstrap_project_id)"
            export RES_BILLING_ACCOUNT="$(resolve billing_account)"
            export RES_ORG_ID="$(resolve org_id)"
            export RES_FOLDER_ID="$(resolve folder_id)"
            export RES_PROJECT_NAME_PREFIX="$(resolve project_name_prefix)"
            export RES_BUCKET_LOCATION="$(resolve bucket_location)"
            export RES_REGION="$(resolve region)"
            export RES_ENABLE_PD="$(resolve enable_persistent_disk)"
            export RES_DISK_ZONE="$(resolve disk_zone)"
            export RES_CALLER_SA="$(resolve caller_sa_email)"
            export RES_USER_PROJECT_ID="$(resolve project_id)"      # optional hint
            export RES_USER_CREATE_PROJECT="$(resolve create_project)" # optional hint

            echo "bootstrap_project_id=${RES_BOOTSTRAP_PROJECT_ID:-<missing>}"
            echo "billing_account=${RES_BILLING_ACCOUNT:-<missing>}"
            echo "org_id=${RES_ORG_ID:-<empty>}"
            echo "folder_id=${RES_FOLDER_ID:-<empty>}"
            echo "project_id(hint)=${RES_USER_PROJECT_ID:-<none>}"
            echo "create_project(hint)=${RES_USER_CREATE_PROJECT:-<none>}"

            # Folder wins if both provided (avoids org policies requiring folders)
            if [ -n "${RES_ORG_ID}" ] && [ -n "${RES_FOLDER_ID}" ]; then
              echo "Both org_id and folder_id were provided; proceeding with folder_id=${RES_FOLDER_ID} and ignoring org_id=${RES_ORG_ID}" >&2
              RES_ORG_ID=""
            fi

            missing=0
            [ -z "${RES_BOOTSTRAP_PROJECT_ID}" ] && echo "Missing required variable: bootstrap_project_id" >&2 && missing=1
            [ -z "${RES_BILLING_ACCOUNT}" ] && echo "Missing required variable: billing_account" >&2 && missing=1
            if [ -z "${RES_ORG_ID}" ] && [ -z "${RES_FOLDER_ID}" ]; then
              echo "Exactly one of org_id or folder_id must be set (not both / not none)." >&2
              missing=1
            fi
            if [ "${missing}" -ne 0 ]; then
              exit 1
            fi

            # Safe defaults
            RES_PROJECT_NAME_PREFIX="${RES_PROJECT_NAME_PREFIX:-env0-tofu-gpf}"
            RES_BUCKET_LOCATION="${RES_BUCKET_LOCATION:-US}"
            RES_REGION="${RES_REGION:-us-central1}"
            RES_ENABLE_PD="${RES_ENABLE_PD:-false}"
            RES_DISK_ZONE="${RES_DISK_ZONE:-us-central1-a}"

            # Normalize boolean for jq --argjson
            EPD="$(echo "${RES_ENABLE_PD}" | tr '[:upper:]' '[:lower:]')"
            if [ "${EPD}" != "true" ] && [ "${EPD}" != "false" ]; then
              EPD="false"
            fi

            # rand hex (fallback if openssl unavailable)
            randhex() {
              if command -v openssl >/dev/null 2>&1; then
                openssl rand -hex 2
              else
                head -c2 /dev/urandom | od -An -tx1 | tr -d ' \n'
              fi
            }

            # Decide final project_id + create_project based on real state
            CANDIDATE_ID="${RES_USER_PROJECT_ID}"
            if [ -z "${CANDIDATE_ID}" ]; then
              CANDIDATE_ID="${RES_PROJECT_NAME_PREFIX}-$(randhex)"
            fi

            FINAL_PROJECT_ID=""
            FINAL_CREATE_PROJECT="true"

            check_state() {
              local pid="$1"
              # Try to describe; if not found or no access, exit nonzero
              local tmp; tmp="$(mktemp)"
              if gcloud projects describe "$pid" --format=json >"$tmp" 2>/dev/null; then
                jq -r '.lifecycleState' "$tmp"
                rm -f "$tmp"
                return 0
              else
                rm -f "$tmp"
                return 1
              fi
            }

            # If user explicitly asked for create_project=false, try to adopt that ID
            if [ "${RES_USER_CREATE_PROJECT,,}" = "false" ] && [ -n "${RES_USER_PROJECT_ID}" ]; then
              if STATE="$(check_state "${RES_USER_PROJECT_ID}")"; then
                echo "Adopting existing project_id=${RES_USER_PROJECT_ID} (state=${STATE})"
                FINAL_PROJECT_ID="${RES_USER_PROJECT_ID}"
                FINAL_CREATE_PROJECT="false"
              else
                echo "WARN: Requested adopt of ${RES_USER_PROJECT_ID}, but describe failed (not found or no access). Will attempt to create it."
                FINAL_PROJECT_ID="${RES_USER_PROJECT_ID}"
                FINAL_CREATE_PROJECT="true"
              fi
            else
              # Auto decide:
              if STATE="$(check_state "${CANDIDATE_ID}")"; then
                case "${STATE}" in
                  ACTIVE|CREATE_REQUESTED)
                    echo "Project ${CANDIDATE_ID} exists in state=${STATE}; adopting."
                    FINAL_PROJECT_ID="${CANDIDATE_ID}"
                    FINAL_CREATE_PROJECT="false"
                    ;;
                  DELETE_REQUESTED|DELETE_IN_PROGRESS|SUSPENDED)
                    echo "Project ${CANDIDATE_ID} not usable (state=${STATE}); generating a fresh ID."
                    FINAL_PROJECT_ID="${RES_PROJECT_NAME_PREFIX}-$(randhex)"
                    FINAL_CREATE_PROJECT="true"
                    ;;
                  *)
                    echo "Project ${CANDIDATE_ID} exists with state=${STATE}; adopting."
                    FINAL_PROJECT_ID="${CANDIDATE_ID}"
                    FINAL_CREATE_PROJECT="false"
                    ;;
                esac
              else
                echo "Project ${CANDIDATE_ID} not found; will create."
                FINAL_PROJECT_ID="${CANDIDATE_ID}"
                FINAL_CREATE_PROJECT="true"
              fi
            fi

            echo "final project_id=${FINAL_PROJECT_ID}"
            echo "final create_project=${FINAL_CREATE_PROJECT}"

            # Write tfvars for Terraform
            jq -n \
              --arg bpid "${RES_BOOTSTRAP_PROJECT_ID}" \
              --arg ba "${RES_BILLING_ACCOUNT}" \
              --arg oid "${RES_ORG_ID}" \
              --arg fid "${RES_FOLDER_ID}" \
              --arg pid "${FINAL_PROJECT_ID}" \
              --arg pfx "${RES_PROJECT_NAME_PREFIX}" \
              --arg loc "${RES_BUCKET_LOCATION}" \
              --arg reg "${RES_REGION}" \
              --arg dz "${RES_DISK_ZONE}" \
              --arg caller "${RES_CALLER_SA}" \
              --argjson epd "${EPD}" \
              --argjson cp  "$( [ "${FINAL_CREATE_PROJECT}" = "true" ] && echo true || echo false )" \
              '{
                bootstrap_project_id: $bpid,
                billing_account: $ba,
                org_id: (if ($oid|length) > 0 then $oid else null end),
                folder_id: (if ($fid|length) > 0 then $fid else null end),
                # decision outputs
                project_id: $pid,
                create_project: $cp,
                # rest of inputs
                project_name_prefix: $pfx,
                bucket_location: $loc,
                region: $reg,
                enable_persistent_disk: $epd,
                disk_zone: $dz,
                caller_sa_email: (if ($caller|length) > 0 then $caller else null end)
              }' > env0.auto.tfvars.json

            echo "Wrote env0.auto.tfvars.json with final project_id + create_project:"
            cat env0.auto.tfvars.json | jq '{project_id, create_project, org_id, folder_id}'

    terraformApply:
      after:
        - name: Print outputs (JSON)
          run: |
            tofu output -json || true
